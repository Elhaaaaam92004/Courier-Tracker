<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Courier Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Riara Express Tracker</h1>
        <p>Enter your Tracking ID to see parcel details:</p>
        <input type="text" id="trackingInput" placeholder="e.g., TRK1001">
        <button onclick="trackParcel()">Track</button>

        <div id="result" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
